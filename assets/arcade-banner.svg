<svg width="860" height="230" viewBox="0 0 860 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient matching GitHub Dark Mode -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <!-- Glowing Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.7" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      fill: #8B949E;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #8B949E;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="856" height="226" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Terminal Controls -->
  <circle cx="28" cy="24" r="5" fill="#FA7970" />
  <circle cx="44" cy="24" r="5" fill="#FAA356" />
  <circle cx="60" cy="24" r="5" fill="#7CE38B" />
  <text x="80" y="28" font-family="'Courier New', monospace" font-size="11" fill="#6E7681" font-weight="600">AADARSH_ARCADE_ENGINE // LIVE ON GITHUB</text>

  <!-- Live Pulse Status Badge -->
  <rect x="735" y="14" width="100" height="22" rx="11" fill="#238636" fill-opacity="0.2" stroke="#2EA043" stroke-width="1" />
  <circle cx="749" cy="25" r="4" fill="#3FB950" />
  <text x="760" y="29" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#3FB950">PLAYABLE NOW</text>

  <!-- Main Arcade Title -->
  <g filter="url(#neonFilter)">
    <text x="430" y="82" text-anchor="middle" class="title" fill="url(#titleGrad)">🕹️ AADARSH'S CYBER ARCADE ⚡</text>
  </g>
  <text x="430" y="108" text-anchor="middle" class="subtitle">Play interactive games directly on my GitHub profile • Powered by GitHub Actions</text>

  <!-- 3 Balanced Cards -->
  <!-- Card 1: 4 Games -->
  <g transform="translate(60, 132)">
    <rect width="220" height="68" rx="10" fill="url(#cardGrad1)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.35" />
    <text x="18" y="28" font-size="20">🟡</text>
    <text x="50" y="28" fill="#38BDF8" class="card-title">4 Playable Games</text>
    <text x="50" y="48" class="card-desc">Connect 4 • TTT • Chess • Wordle</text>
  </g>

  <!-- Card 2: AI Battle -->
  <g transform="translate(320, 132)">
    <rect width="220" height="68" rx="10" fill="url(#cardGrad2)" stroke="#A855F7" stroke-width="1" stroke-opacity="0.35" />
    <text x="18" y="28" font-size="20">🤖</text>
    <text x="50" y="28" fill="#C084FC" class="card-title">Aadarsh-AI Opponent</text>
    <text x="50" y="48" class="card-desc">Smart counter-moves in ~10s</text>
  </g>

  <!-- Card 3: Hall of Fame -->
  <g transform="translate(580, 132)">
    <rect width="220" height="68" rx="10" fill="url(#cardGrad3)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.35" />
    <text x="18" y="28" font-size="20">🏆</text>
    <text x="50" y="28" fill="#FBBF24" class="card-title">Live Hall of Fame</text>
    <text x="50" y="48" class="card-desc">Earn points, win streaks &amp; badges</text>
  </g>
</svg>
