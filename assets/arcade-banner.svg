<svg width="860" height="240" viewBox="0 0 860 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Neon Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Badge Gradients -->
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.25" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="boxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#00F7FF" flood-opacity="0.2" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(240px); }
    }
    .main-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: 3px;
    }
    .sub-title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 4px;
      fill: #94A3B8;
      font-weight: 600;
    }
    .badge-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .scan-beam {
      animation: scanline 8s linear infinite;
    }
  </style>

  <!-- Container Box with Rounded Corners and Neon Border -->
  <rect x="3" y="3" width="854" height="234" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#boxGlow)" />

  <!-- Grid Accents -->
  <g opacity="0.08" stroke="#00F7FF" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240" />
    <line x1="140" y1="0" x2="140" y2="240" />
    <line x1="240" y1="0" x2="240" y2="240" />
    <line x1="340" y1="0" x2="340" y2="240" />
    <line x1="440" y1="0" x2="440" y2="240" />
    <line x1="540" y1="0" x2="540" y2="240" />
    <line x1="640" y1="0" x2="640" y2="240" />
    <line x1="740" y1="0" x2="740" y2="240" />
    <line x1="840" y1="0" x2="840" y2="240" />
    <line x1="0" y1="40" x2="860" y2="40" />
    <line x1="0" y1="90" x2="860" y2="90" />
    <line x1="0" y1="140" x2="860" y2="140" />
    <line x1="0" y1="190" x2="860" y2="190" />
  </g>

  <!-- Top Status Bar -->
  <circle cx="28" cy="26" r="5" fill="#EF4444" />
  <circle cx="44" cy="26" r="5" fill="#F59E0B" />
  <circle cx="60" cy="26" r="5" fill="#10B981" />
  <text x="80" y="30" font-family="'Fira Code', monospace" font-size="11" fill="#64748B" font-weight="600">ARCADE_SYS // V2.0 // GITHUB_ACTIONS_ONLINE</text>
  <rect x="740" y="16" width="94" height="20" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
  <circle cx="752" cy="26" r="3.5" fill="#10B981" />
  <text x="762" y="30" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#10B981">LIVE ARCADE</text>

  <!-- Main Arcade Title -->
  <g filter="url(#neonGlow)">
    <text x="430" y="98" text-anchor="middle" class="main-title" fill="url(#titleGrad)">🕹️ AADARSH'S CYBER ARCADE ⚡</text>
  </g>
  <text x="430" y="126" text-anchor="middle" class="sub-title">// 4 PLAYABLE GAMES • REAL-TIME LEADERBOARD • 100% GITHUB ACTIONS</text>

  <!-- Interactive Badges Row -->
  <!-- Badge 1: 4 Games -->
  <g transform="translate(130, 155)">
    <rect width="180" height="42" rx="8" fill="url(#badgeGrad1)" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.4" />
    <text x="24" y="26" font-size="18">🟡❌</text>
    <text x="64" y="26" fill="#38BDF8" class="badge-text">4 Interactive Games</text>
  </g>

  <!-- Badge 2: AI Battle -->
  <g transform="translate(340, 155)">
    <rect width="180" height="42" rx="8" fill="url(#badgeGrad2)" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4" />
    <text x="24" y="26" font-size="18">♟️🤖</text>
    <text x="64" y="26" fill="#C084FC" class="badge-text">Tactical AI Engine</text>
  </g>

  <!-- Badge 3: Hall of Fame -->
  <g transform="translate(550, 155)">
    <rect width="180" height="42" rx="8" fill="url(#badgeGrad3)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
    <text x="24" y="26" font-size="18">🏆🔥</text>
    <text x="64" y="26" fill="#FBBF24" class="badge-text">Live Hall of Fame</text>
  </g>

  <!-- Bottom Terminal Hint -->
  <text x="430" y="222" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#475569">
    &gt; Click any move below to submit your turn. GitHub Actions updates the board in ~10 seconds.
  </text>
</svg>
