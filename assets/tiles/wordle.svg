<svg width="130" height="110" viewBox="0 0 130 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wordleBg" x1="0" y1="0" x2="130" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="wordleBorder" x1="0" y1="0" x2="130" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="128" height="108" rx="14" fill="url(#wordleBg)"/>
  <rect x="1" y="1" width="128" height="108" rx="14" stroke="url(#wordleBorder)" stroke-width="1.5"/>

  <!-- Top Accent Glow -->
  <path d="M20 2 H110" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- 5 Wordle Letter Tiles -->
  <g transform="translate(18, 22)">
    <!-- Tile 1: Green -->
    <rect x="0" y="4" width="16" height="20" rx="3" fill="#10b981"/>
    <text x="8" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>

    <!-- Tile 2: Yellow -->
    <rect x="19" y="4" width="16" height="20" rx="3" fill="#eab308"/>
    <text x="27" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">O</text>

    <!-- Tile 3: Dark -->
    <rect x="38" y="4" width="16" height="20" rx="3" fill="#334155"/>
    <text x="46" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">R</text>

    <!-- Tile 4: Green -->
    <rect x="57" y="4" width="16" height="20" rx="3" fill="#10b981"/>
    <text x="65" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>

    <!-- Tile 5: Dark -->
    <rect x="76" y="4" width="16" height="20" rx="3" fill="#334155"/>
    <text x="84" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">L</text>
  </g>

  <!-- Label -->
  <text x="65" y="94" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.8">WORDLE</text>
</svg>