<svg width="135" height="135" viewBox="0 0 135 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wordleBg" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="wordleBorder" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="133" height="133" rx="14" fill="url(#wordleBg)"/>
  <rect x="1" y="1" width="133" height="133" rx="14" stroke="url(#wordleBorder)" stroke-width="1.5"/>

  <!-- Top Accent Glow -->
  <path d="M24 2 H111" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Top Category Tag -->
  <text x="67.5" y="19" font-family="'JetBrains Mono', -apple-system, monospace" font-size="8" font-weight="700" fill="#a855f7" text-anchor="middle" letter-spacing="1.5" opacity="0.85">WORD PUZZLE</text>

  <!-- 5 Wordle Letter Tiles -->
  <g transform="translate(20, 31)">
    <!-- Tile 1: Green -->
    <rect x="0" y="4" width="16" height="20" rx="3" fill="#10b981"/>
    <text x="8" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>

    <!-- Tile 2: Yellow -->
    <rect x="19" y="4" width="16" height="20" rx="3" fill="#eab308"/>
    <text x="27" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">O</text>

    <!-- Tile 3: Dark -->
    <rect x="38" y="4" width="16" height="20" rx="3" fill="#334155"/>
    <text x="46" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">R</text>

    <!-- Tile 4: Green -->
    <rect x="57" y="4" width="16" height="20" rx="3" fill="#10b981"/>
    <text x="65" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>

    <!-- Tile 5: Dark -->
    <rect x="76" y="4" width="16" height="20" rx="3" fill="#334155"/>
    <text x="84" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">L</text>
  </g>

  <!-- Title -->
  <text x="67.5" y="85" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">WORDLE</text>

  <!-- Interactive Action Button Pill -->
  <rect x="22" y="98" width="91" height="24" rx="12" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.2"/>
  <polygon points="45,105 45,115 54,110" fill="#a855f7"/>
  <text x="73" y="113.5" font-family="'Outfit', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#a855f7" text-anchor="middle" letter-spacing="1.2">PLAY</text>
</svg>
