<svg width="130" height="110" viewBox="0 0 130 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cricketBg" x1="0" y1="0" x2="130" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="cricketBorder" x1="0" y1="0" x2="130" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="128" height="108" rx="14" fill="url(#cricketBg)"/>
  <rect x="1" y="1" width="128" height="108" rx="14" stroke="url(#cricketBorder)" stroke-width="1.5"/>

  <!-- Top Accent Glow -->
  <path d="M20 2 H110" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Cricket Bat & Ball Favicon -->
  <g transform="translate(42, 18)">
    <!-- Wooden Bat Angled -->
    <rect x="12" y="4" width="5" height="10" rx="1" fill="#ffffff" transform="rotate(-35 12 4)"/>
    <rect x="11" y="12" width="10" height="26" rx="2" fill="#d97706" transform="rotate(-35 11 12)"/>
    <rect x="13" y="14" width="6" height="22" rx="1" fill="#b45309" transform="rotate(-35 13 14)"/>

    <!-- Red Cricket Ball with Seam -->
    <circle cx="34" cy="30" r="7.5" fill="#dc2626"/>
    <path d="M29 32 C33 28, 35 28, 39 32" stroke="#ffffff" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Label -->
  <text x="65" y="94" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.8">CRICKET</text>
</svg>