<svg width="135" height="135" viewBox="0 0 135 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chessBgDark" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="chessBorderDark" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="knightGoldGradDark" x1="42" y1="26" x2="90" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="knightManeHighlight" x1="50" y1="30" x2="72" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="chessAuraDark" cx="67.5" cy="50" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowGold" x="30" y="16" width="75" height="70" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="133" height="133" rx="14" fill="url(#chessBgDark)"/>
  <rect x="1" y="1" width="133" height="133" rx="14" stroke="url(#chessBorderDark)" stroke-width="1.5"/>

  <!-- Top Accent Glow -->
  <path d="M22 2 H113" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Top Category Tag -->
  <text x="67.5" y="19" font-family="'JetBrains Mono', -apple-system, monospace" font-size="8" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">AI GRANDMASTER</text>

  <!-- Subtle Ambient Glow Behind Knight -->
  <circle cx="67.5" cy="50" r="28" fill="url(#chessAuraDark)"/>

  <!-- Staunton Knight Centerpiece -->
  <g id="staunton-knight">
    <!-- Knight Cast Shadow -->
    <ellipse cx="67.5" cy="74.5" rx="20" ry="3.5" fill="#030712" opacity="0.8"/>

    <!-- Pedestal Base Lower Tier -->
    <rect x="46" y="70" width="43" height="4" rx="2" fill="#1e293b"/>
    <rect x="47" y="70.5" width="41" height="1.5" rx="0.75" fill="#334155"/>
    <path d="M46 72 H89" stroke="#fbbf24" stroke-width="0.8" opacity="0.85"/>

    <!-- Pedestal Base Upper Beveled Ring -->
    <path d="M50 70 L53 66 H82 L85 70 Z" fill="#b45309"/>
    <path d="M52.5 66.8 H82.5" stroke="#fef08a" stroke-width="0.8" opacity="0.7"/>

    <!-- Main Knight Sculpted Body -->
    <path d="M53 66 
             C54 62, 53 58, 51 54 
             C49 50, 46 47, 44 43 
             C42 39, 44 35, 48 34 
             C50 33.5, 53 35, 55 37 
             C56 34, 57 30, 59 27 
             C60 25.5, 61.5 25, 63 26 
             C63.5 26.5, 63.5 28, 63 30 
             C66 29, 71 30, 75 33 
             C80 37, 83 42, 81 48 
             C79 51, 76 52, 74 52 
             C77 55, 78 59, 79 63 
             C79.5 65, 80 66, 82 66 
             Z" 
          fill="url(#knightGoldGradDark)"/>

    <!-- Mane Grooves & Serrations -->
    <path d="M60 29 C63 34, 62 40, 58 45 M65 33 C68 38, 68 44, 64 50 M71 38 C74 44, 74 51, 70 56" 
          stroke="#92400e" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Head & Brow Specular Ridge -->
    <path d="M48 35 C52 38, 56 42, 57 48 C57 51, 55 54, 52 56" 
          stroke="url(#knightManeHighlight)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Alert Ear Notch -->
    <path d="M60 26.5 L62.5 30.5 L58.5 29.5 Z" fill="#fef08a"/>

    <!-- Piercing Eye Glint -->
    <ellipse cx="53" cy="38" rx="1.6" ry="1.2" fill="#0f172a"/>
    <circle cx="53.4" cy="37.8" r="0.6" fill="#ffffff"/>

    <!-- Muzzle / Nostril Cutout -->
    <ellipse cx="46.5" cy="41" rx="1" ry="0.8" fill="#78350f" transform="rotate(-20 46.5 41)"/>
    <path d="M44 43 C46 44.5, 49 44.5, 51 43" stroke="#78350f" stroke-width="1" stroke-linecap="round"/>

    <!-- Chest Muscle Contour -->
    <path d="M53 60 C57 56, 61 53, 64 53" stroke="#fef08a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="67.5" y="87" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">CHESS</text>

  <!-- Interactive Action Button Pill -->
  <rect x="22" y="99" width="91" height="24" rx="12" fill="rgba(245, 158, 11, 0.16)" stroke="#f59e0b" stroke-width="1.3"/>
  <polygon points="44,106 44,116 53,111" fill="#fbbf24"/>
  <text x="73" y="114.5" font-family="'Outfit', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1.2">PLAY</text>
</svg>