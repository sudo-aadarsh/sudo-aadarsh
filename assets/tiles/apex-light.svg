<svg width="135" height="135" viewBox="0 0 135 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apexBgLight" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="apexBorderLight" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="carBodyLightGrad" x1="20" y1="40" x2="115" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="133" height="133" rx="14" fill="url(#apexBgLight)"/>
  <rect x="1" y="1" width="133" height="133" rx="14" stroke="url(#apexBorderLight)" stroke-width="1.5"/>

  <!-- Top Accent Glow -->
  <path d="M24 2 H111" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Top Category Tag -->
  <text x="67.5" y="19" font-family="'JetBrains Mono', -apple-system, monospace" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle" letter-spacing="1.5">3D RACING</text>

  <!-- 3D Racing Supercar Silhouette -->
  <g transform="translate(18, 30)">
    <!-- Speed Lines Behind Car -->
    <path d="M2 18 H20" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M6 14 H18" stroke="#0369a1" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M0 24 H14" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Car Body -->
    <!-- Rear Wing -->
    <path d="M12 12 H26 V14 H12 Z" fill="#0284c7"/>
    <path d="M16 14 L18 20 H22 L20 14 Z" fill="#0369a1"/>

    <!-- Main Chassis & Cockpit -->
    <path d="M22 22 L34 14 C42 12 56 12 66 16 L84 22 L94 24 C97 25 98 27 96 29 L92 31 H16 C14 31 13 29 15 27 L22 22 Z" fill="url(#carBodyLightGrad)"/>

    <!-- Cockpit Windshield -->
    <path d="M38 16 C46 13.5 56 13.5 64 16 L76 21 H32 L38 16 Z" fill="#0f172a" opacity="0.9"/>
    <path d="M42 17 L60 17 L70 20 H36 Z" stroke="#38bdf8" stroke-width="0.8" opacity="0.7"/>

    <!-- Front Splitter & Headlight Beam -->
    <path d="M88 28 L98 28" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="98,27 106,25 106,31 98,29" fill="#0284c7" opacity="0.2"/>

    <!-- Wheels (Wheels with Blue Rims) -->
    <!-- Rear Wheel -->
    <circle cx="28" cy="30" r="7" fill="#1e293b" stroke="#0284c7" stroke-width="1.6"/>
    <circle cx="28" cy="30" r="3" fill="#0284c7"/>

    <!-- Front Wheel -->
    <circle cx="78" cy="30" r="7" fill="#1e293b" stroke="#0284c7" stroke-width="1.6"/>
    <circle cx="78" cy="30" r="3" fill="#0284c7"/>
  </g>

  <!-- Title -->
  <text x="67.5" y="85" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1">APEX VELOCITY</text>

  <!-- Interactive Action Button Pill -->
  <rect x="22" y="98" width="91" height="24" rx="12" fill="rgba(2, 132, 199, 0.1)" stroke="#0284c7" stroke-width="1.4"/>
  <polygon points="45,105 45,115 54,110" fill="#0284c7"/>
  <text x="73" y="113.5" font-family="'Outfit', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#0284c7" text-anchor="middle" letter-spacing="1.2">PLAY</text>
</svg>
