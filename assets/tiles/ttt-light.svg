<svg width="135" height="135" viewBox="0 0 135 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tttBgLight" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="tttBorderLight" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="133" height="133" rx="14" fill="url(#tttBgLight)"/>
  <rect x="1" y="1" width="133" height="133" rx="14" stroke="url(#tttBorderLight)" stroke-width="1.5"/>

  <!-- Top Accent Glow -->
  <path d="M24 2 H111" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Top Category Tag -->
  <text x="67.5" y="19" font-family="'JetBrains Mono', -apple-system, monospace" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle" letter-spacing="1.5">VERSUS AI</text>

  <!-- Minimalist X and O Favicon -->
  <g transform="translate(40, 29)">
    <!-- X in Deep Blue -->
    <line x1="4" y1="8" x2="22" y2="26" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="22" y1="8" x2="4" y2="26" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round"/>
    <!-- O in Crimson Coral -->
    <circle cx="44" cy="17" r="9" stroke="#e11d48" stroke-width="4.5" fill="none"/>
  </g>

  <!-- Title -->
  <text x="67.5" y="85" font-family="'Outfit', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.8">TIC-TAC-TOE</text>

  <!-- Interactive Action Button Pill -->
  <rect x="22" y="98" width="91" height="24" rx="12" fill="rgba(2, 132, 199, 0.1)" stroke="#0284c7" stroke-width="1.4"/>
  <polygon points="45,105 45,115 54,110" fill="#0369a1"/>
  <text x="73" y="113.5" font-family="'Outfit', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="1.2">PLAY</text>
</svg>
