<svg width="135" height="135" viewBox="0 0 135 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leadBgLight" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="leadBorderLight" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="133" height="133" rx="14" fill="url(#leadBgLight)"/>
  <rect x="1" y="1" width="133" height="133" rx="14" stroke="url(#leadBorderLight)" stroke-width="1.5"/>

  <!-- Top Accent Glow -->
  <path d="M24 2 H111" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Top Category Tag -->
  <text x="67.5" y="19" font-family="'JetBrains Mono', -apple-system, monospace" font-size="8" font-weight="700" fill="#c2410c" text-anchor="middle" letter-spacing="1.5">HALL OF FAME</text>

  <!-- Golden Champion Trophy Favicon -->
  <g transform="translate(49, 26) scale(0.9)">
    <!-- Cup Body -->
    <path d="M6 6 H34 V18 C34 26 28 32 20 32 C12 32 6 26 6 18 Z" fill="#d97706"/>
    <!-- Left Handle -->
    <path d="M6 10 H2 C0 10 0 20 6 20" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Right Handle -->
    <path d="M34 10 H38 C40 10 40 20 34 20" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Stem and Base -->
    <path d="M17 32 H23 V36 H17 Z" fill="#b45309"/>
    <path d="M12 36 H28 V40 H12 Z" fill="#78350f"/>
    <!-- Star on Cup -->
    <polygon points="20,11 22,16 27,16 23,19 25,24 20,21 15,24 17,19 13,16 18,16" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Title -->
  <text x="67.5" y="85" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.8">LEADERBOARD</text>

  <!-- Interactive Action Button Pill -->
  <rect x="22" y="98" width="91" height="24" rx="12" fill="rgba(234, 88, 12, 0.1)" stroke="#ea580c" stroke-width="1.4"/>
  <text x="67.5" y="113.5" font-family="'Outfit', -apple-system, sans-serif" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle" letter-spacing="1">★ RANKS</text>
</svg>
