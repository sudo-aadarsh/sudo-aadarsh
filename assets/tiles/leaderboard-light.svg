<svg width="135" height="135" viewBox="0 0 135 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leadBgLight" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="leadBorderLight" x1="0" y1="0" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="trophyGoldGradLight" x1="40" y1="26" x2="95" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="leadAuraLight" cx="67.5" cy="50" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="133" height="133" rx="14" fill="url(#leadBgLight)"/>
  <rect x="1" y="1" width="133" height="133" rx="14" stroke="url(#leadBorderLight)" stroke-width="1.5"/>

  <!-- Top Accent Glow -->
  <path d="M22 2 H113" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Top Category Tag -->
  <text x="67.5" y="19" font-family="'JetBrains Mono', -apple-system, monospace" font-size="8" font-weight="700" fill="#c2410c" text-anchor="middle" letter-spacing="1.5">HALL OF FAME</text>

  <!-- Golden Radiance Glow -->
  <circle cx="67.5" cy="50" r="28" fill="url(#leadAuraLight)"/>

  <!-- Drop Shadow -->
  <ellipse cx="67.5" cy="74.5" rx="22" ry="3.5" fill="#94a3b8" opacity="0.45"/>

  <!-- Championship Trophy Vector Group -->
  <g id="championship-trophy-light">
    <!-- Obsidian Marble Multi-Tier Base -->
    <rect x="48" y="70" width="39" height="4" rx="1.5" fill="#0f172a"/>
    <rect x="49" y="70.5" width="37" height="1.5" fill="#1e293b"/>
    <path d="M48 72 H87" stroke="#ea580c" stroke-width="0.8" opacity="0.9"/>

    <!-- Upper Marble Pedestal Block -->
    <rect x="53" y="65" width="29" height="5" rx="1" fill="#1e293b"/>
    <!-- Gold Inscribed Plaque -->
    <rect x="56" y="66" width="23" height="3" rx="0.75" fill="#d97706"/>
    <rect x="57" y="66.5" width="21" height="2" rx="0.5" fill="#fde68a"/>

    <!-- Fluted Golden Stem & Rings -->
    <path d="M63 58 H72 L70 65 H65 Z" fill="#9a3412"/>
    <ellipse cx="67.5" cy="62" rx="5" ry="1.2" fill="#d97706"/>
    <ellipse cx="67.5" cy="58.5" rx="6.5" ry="1.4" fill="#b45309"/>

    <!-- Left Swept Trophy Handle -->
    <path d="M49 33 C39 33, 38 48, 51 51 C52 51, 52 48, 51 47 C43 45, 43 36, 49 36 Z" fill="url(#trophyGoldGradLight)"/>
    <path d="M49 33 C39 33, 38 48, 51 51" stroke="#fde68a" stroke-width="0.8" fill="none" opacity="0.8"/>

    <!-- Right Swept Trophy Handle -->
    <path d="M86 33 C96 33, 97 48, 84 51 C83 51, 83 48, 84 47 C92 45, 92 36, 86 36 Z" fill="url(#trophyGoldGradLight)"/>
    <path d="M86 33 C96 33, 97 48, 84 51" stroke="#fde68a" stroke-width="0.8" fill="none" opacity="0.8"/>

    <!-- Main Cup Chalice Bowl -->
    <path d="M47 30 
             H88 
             V40 
             C88 51, 79 58, 67.5 58 
             C56 58, 47 51, 47 40 
             Z" 
          fill="url(#trophyGoldGradLight)"/>

    <!-- Polished Cup Lip Rim -->
    <ellipse cx="67.5" cy="30" rx="20.5" ry="3.5" fill="#d97706"/>
    <ellipse cx="67.5" cy="29.5" rx="20.5" ry="2.5" fill="#fef3c7"/>
    <ellipse cx="67.5" cy="30" rx="18.5" ry="2" fill="#451a03" opacity="0.6"/>

    <!-- Cup Body Specular Contour -->
    <path d="M52 35 C50 42, 53 49, 61 54" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Embossed 3D Star on Chalice -->
    <g transform="translate(67.5, 44)">
      <!-- Star Dropshadow -->
      <polygon points="0,-8 2.4,-2.4 8,-2.4 3.5,1.2 5.2,7 0,3.6 -5.2,7 -3.5,1.2 -8,-2.4 -2.4,-2.4" fill="#451a03" opacity="0.8"/>
      <!-- Star Golden Facets -->
      <polygon points="0,-8.5 2.4,-2.9 8,-2.9 3.5,0.7 5.2,6.5 0,3.1 -5.2,6.5 -3.5,0.7 -8,-2.9 -2.4,-2.9" fill="#fef3c7"/>
      <!-- Left Shaded Facet -->
      <polygon points="0,-8.5 0,3.1 -5.2,6.5 -3.5,0.7 -8,-2.9 -2.4,-2.9" fill="#d97706" opacity="0.7"/>
    </g>

    <!-- Victory Glint Starbursts -->
    <g transform="translate(47, 28.5)">
      <polygon points="0,-3.5 1,-1 3.5,0 1,1 0,3.5 -1,1 -3.5,0 -1,-1" fill="#ea580c"/>
    </g>
    <g transform="translate(86, 32)">
      <polygon points="0,-2.5 0.7,-0.7 2.5,0 0.7,0.7 0,2.5 -0.7,0.7 -2.5,0 -0.7,-0.7" fill="#ea580c"/>
    </g>
  </g>

  <!-- Title -->
  <text x="67.5" y="87" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.8">LEADERBOARD</text>

  <!-- Interactive Action Button Pill -->
  <rect x="22" y="99" width="91" height="24" rx="12" fill="rgba(234, 88, 12, 0.1)" stroke="#ea580c" stroke-width="1.3"/>
  <text x="67.5" y="114.5" font-family="'Outfit', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#c2410c" text-anchor="middle" letter-spacing="1">★ RANKS</text>
</svg>