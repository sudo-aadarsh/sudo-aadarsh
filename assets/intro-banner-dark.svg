<svg width="880" height="175" viewBox="0 0 880 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="880" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#0e1526"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="880" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120, 30) scale(240 160)">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowIndigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760, 140) scale(220 150)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .name-title { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle-text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 500; fill: #94a3b8; }
    .tag-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="878" height="173" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="878" height="173" rx="16" fill="url(#glowCyan)"/>
  <rect x="1" y="1" width="878" height="173" rx="16" fill="url(#glowIndigo)"/>
  <rect x="1" y="1" width="878" height="173" rx="16" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Terminal Bar -->
  <circle cx="28" cy="24" r="5" fill="#ef4444"/>
  <circle cx="44" cy="24" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="24" r="5" fill="#10b981"/>

  <!-- Active Status Tag -->
  <rect x="690" y="14" width="162" height="22" rx="11" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <circle cx="706" cy="25" r="3.5" fill="#38bdf8"/>
  <text x="716" y="29" class="tag-badge">SYSTEMS ONLINE</text>

  <!-- Content -->
  <text x="440" y="92" text-anchor="middle" class="name-title">Aadarsh Jha</text>
  <text x="440" y="126" text-anchor="middle" class="subtitle-text">Software Engineer &amp; Systems Builder • Bengaluru, India</text>
</svg>