<svg width="715" height="42" viewBox="0 0 715 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arcBgLight" x1="0" y1="0" x2="715" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="arcBorderLight" x1="0" y1="0" x2="715" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="713" height="40" rx="10" fill="url(#arcBgLight)"/>
  <rect x="1" y="1" width="713" height="40" rx="10" stroke="url(#arcBorderLight)" stroke-width="1.2"/>

  <!-- Left: Live Arcade indicator -->
  <circle cx="24" cy="21" r="4.5" fill="#10b981"/>
  <circle cx="24" cy="21" r="7.5" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2"/>
  <text x="38" y="25" font-family="'JetBrains Mono', -apple-system, monospace" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="1.2">PLAYABLE ARCADE</text>

  <!-- Middle: Instruction -->
  <text x="368" y="25" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">Select any game below to play in browser</text>

  <!-- Right: Badge -->
  <rect x="595" y="9" width="104" height="24" rx="12" fill="rgba(2, 132, 199, 0.08)" stroke="rgba(2, 132, 199, 0.3)" stroke-width="1"/>
  <text x="647" y="24.5" font-family="'JetBrains Mono', -apple-system, monospace" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle" letter-spacing="1">INSTANT PLAY</text>
</svg>
